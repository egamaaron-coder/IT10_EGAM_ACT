<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h2>Student Registration Form</h2>
        <p>Join our school club today!</p>

        <form>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="course">Select Your Course:</label>
            <select id="course" name="course" required>
                <option value="">Choose your course</option>
                <option value="BSIT">BS Information Technology</option>
                <option value="BSCS">BS Computer Science</option>
                <option value="BSBA">BS Business Administration</option>
                <option value="BSED">BS Secondary Education</option>
            </select>

            <label for="reason">Why do you want to join our club?</label>
            <textarea id="reason" name="reason" placeholder="Write your reason here..."></textarea>

            <button type="submit">Submit Registration</button>
        </form>
    </main>
</body>
</html>
